name: Sync with upstream and apply patch

on:
  push:
    branches:
      - patches
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: patches
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream tag
        id: latest_tag
        run: |
          git remote add upstream https://github.com/wessamlauf/homeassistant-frosted-glass-themes.git
          git fetch upstream --tags
          LATEST_TAG=$(git ls-remote --tags upstream | awk -F/ '{print $3}' | grep -v '{}' | sort -V | tail -n 1)
          git checkout -B main $LATEST_TAG
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Remove upstream workflow
        run: |
          rm -f .github/workflows/validate.yaml

      - name: Restore fork workflow
        run: |
          git fetch origin patches:patches
          git checkout patches -- .github/workflows/sync.yaml

      - name: Append state colors to theme files
        run: |
          python3 -c '
          import glob, os

          ADDITIONS = "\n  state-fan-active-color: \"#ffbc3d\"\n  state-cover-active-color: \"#ffbc3d\"\n"

          for filepath in glob.glob("themes/*.yaml"):
              with open(filepath, "r") as f:
                  content = f.read()
              if "state-fan-active-color" not in content:
                  with open(filepath, "a") as f:
                      f.write(ADDITIONS)
                  print(f"Updated {filepath}")
          '

      - name: Verify theme changes
        run: |
          git diff themes/

      - name: Commit changes
        id: commit_patch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Apply state color customizations"
            echo "patch_committed=true" >> $GITHUB_OUTPUT
          else
            echo "patch_committed=false" >> $GITHUB_OUTPUT
          fi

      - name: Push to main
        if: steps.commit_patch.outputs.patch_committed == 'true'
        run: |
          PATCHED_TAG="${{ steps.latest_tag.outputs.latest_tag }}-patched"
          git tag -f "$PATCHED_TAG"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} main:main "$PATCHED_TAG"

      - name: Create GitHub release
        if: steps.commit_patch.outputs.patch_committed == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.latest_tag.outputs.latest_tag }}-patched
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
